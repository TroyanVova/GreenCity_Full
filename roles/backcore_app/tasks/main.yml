---
- name: Створити/оновити .env для backcore
  ansible.builtin.template:
    src: env.j2
    dest: "{{ repo_dest }}/{{ app_subpath }}/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  notify: restart backcore

- name: mvn formatter:format
  ansible.builtin.command: /opt/maven/bin/mvn formatter:format
  args:
    chdir: "{{ repo_dest }}/{{ app_subpath }}"
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    PATH: "/opt/maven/bin:/usr/bin:/bin:/usr/local/bin"
  changed_when: true

- name: mvn clean package
  ansible.builtin.command: /opt/maven/bin/mvn clean package
  args:
    chdir: "{{ repo_dest }}/{{ app_subpath }}"
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    PATH: "/opt/maven/bin:/usr/bin:/bin:/usr/local/bin"
  changed_when: true

- name: Перевірити, що core.jar зібрався
  ansible.builtin.stat:
    path: "{{ repo_dest }}/{{ app_subpath }}/{{ jar_relative_path }}"
  register: backcore_jar

- name: "Помилка: core.jar не знайдено після mvn clean package"
  ansible.builtin.fail:
    msg: "Очікував {{ repo_dest }}/{{ app_subpath }}/{{ jar_relative_path }} - перевірте лог збірки вище"
  when: not backcore_jar.stat.exists

- name: Розгорнути systemd unit greencity-backcore
  ansible.builtin.template:
    src: greencity-backcore.service.j2
    dest: /etc/systemd/system/greencity-backcore.service
    mode: "0644"
  notify: restart backcore

- name: Застосувати systemd unit одразу
  ansible.builtin.meta: flush_handlers

- name: Увімкнути і запустити greencity-backcore
  ansible.builtin.systemd:
    name: greencity-backcore
    state: started
    enabled: true
