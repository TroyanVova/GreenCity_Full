---
- name: Зачекати завершення cloud-init
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false

- name: Оновити кеш apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  register: apt_update_result
  until: apt_update_result is succeeded
  retries: 5
  delay: 10

- name: Встановити базові пакети
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - unzip
      - ca-certificates
      - gnupg
      - qemu-guest-agent
      - python3-pip
    state: present
  register: apt_install_result
  until: apt_install_result is succeeded
  retries: 5
  delay: 10

- name: Переконатись, що qemu-guest-agent запущений
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: started
    enabled: true

- name: Встановити часовий пояс
  community.general.timezone:
    name: "{{ timezone }}"

- name: Створити базову директорію застосунку
  ansible.builtin.file:
    path: "{{ repo_dest }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
