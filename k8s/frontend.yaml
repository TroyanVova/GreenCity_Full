# frontend (Angular + Nginx, port 80).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: greencity
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: REPLACE_WITH_ECR_URL/greencity-frontend:initial
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_LINK
              value: "http://greencity-alb-1035474643.us-east-1.elb.amazonaws.com/core/"
            - name: BACKEND_USER_LINK
              value: "http://greencity-alb-1035474643.us-east-1.elb.amazonaws.com/user/"
            - name: FRONTEND_LINK
              value: "http://greencity-alb-1035474643.us-east-1.elb.amazonaws.com/"
            - name: BACKEND_CHAT_LINK
              value: "unused"
            - name: BACKEND_UBS_LINK
              value: "unused"
            - name: SOCKET
              value: "unused"
            - name: CHAT_SOCKET
              value: "unused"
            - name: API_KEYS
              value: "unused"
            - name: API_MAP_KEY
              value: "unused"
            - name: FIREBASE_API_KEY
              value: "unused"
            - name: FIREBASE_AUTH_DOMAIN
              value: "unused"
            - name: FIREBASE_DATABASE_URL
              value: "unused"
            - name: FIREBASE_PROJECT_ID
              value: "unused"
            - name: FIREBASE_STORAGE_BUCKET
              value: "unused"
            - name: FIREBASE_MESSAGING_SENDER_ID
              value: "unused"
            - name: FIREBASE_APP_ID
              value: "unused"
            - name: FIREBASE_MEASUREMENT_ID
              value: "unused"
            - name: BACKEND_UBS_ADMIN_LINK
              value: "unused"
            - name: GOOGLE_CLIENT_ID
              value: "unused"
            - name: AGM_CORE_MODULE_API_KEY
              value: "unused"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: greencity
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
