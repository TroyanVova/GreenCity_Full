# backcore (Spring Boot, port 8080).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backcore
  namespace: greencity
  labels:
    app: backcore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backcore
  template:
    metadata:
      labels:
        app: backcore
    spec:
      containers:
        - name: backcore
          image: REPLACE_WITH_ECR_URL/greencity-backcore:initial
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: greencity-secrets
          env:
            - name: SPRING_REDIS_HOST
              value: "redis.greencity.svc.cluster.local"
            - name: SPRING_REDIS_PORT
              value: "6379"
            - name: DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: greencity-secrets
                  key: SPRING_DATASOURCE_URL
            - name: DATASOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: greencity-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: greencity-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: AZURE_CONNECTION_STRING
              value: "unused"
            - name: AZURE_CONTAINER_NAME
              value: "unused"
            - name: EMAIL_ADDRESS
              value: "unused@example.com"
            - name: EMAIL_PASSWORD
              value: "unused"
            - name: GOOGLE_CLIENT_ID
              value: "unused"
            - name: GOOGLE_CLIENT_ID_MANAGER
              value: "unused"
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/core"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /core/actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /core/actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /core/actuator/health
              port: 8080
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backcore
  namespace: greencity
spec:
  type: NodePort
  selector:
    app: backcore
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30880
