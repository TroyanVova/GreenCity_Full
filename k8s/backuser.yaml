# backuser (Spring Boot, port 8060).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backuser
  namespace: greencity
  labels:
    app: backuser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backuser
  template:
    metadata:
      labels:
        app: backuser
    spec:
      containers:
        - name: backuser
          image: REPLACE_WITH_ECR_URL/greencity-backuser:initial
          imagePullPolicy: Always
          ports:
            - containerPort: 8060
          envFrom:
            - secretRef:
                name: greencity-secrets
          env:
            - name: SPRING_REDIS_HOST
              value: "redis.greencity.svc.cluster.local"
            - name: SPRING_REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8060
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8060
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backuser
  namespace: greencity
spec:
  type: NodePort
  selector:
    app: backuser
  ports:
    - port: 8060
      targetPort: 8060
      nodePort: 30860
