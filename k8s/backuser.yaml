# backuser (Spring Boot, port 8060).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backuser
  namespace: greencity
  labels:
    app: backuser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backuser
  template:
    metadata:
      labels:
        app: backuser
    spec:
      containers:
        - name: backuser
          image: REPLACE_WITH_ECR_URL/greencity-backuser:initial
          imagePullPolicy: Always
          ports:
            - containerPort: 8060
          envFrom:
            - secretRef:
                name: greencity-secrets
          env:
            - name: SPRING_REDIS_HOST
              value: "redis.greencity.svc.cluster.local"
            - name: SPRING_REDIS_PORT
              value: "6379"
            - name: DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: greencity-secrets
                  key: SPRING_DATASOURCE_URL
            - name: DATASOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: greencity-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: greencity-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: AZURE_CONNECTION_STRING
              value: "unused"
            - name: AZURE_CONTAINER_NAME
              value: "unused"
            - name: EMAIL_ADDRESS
              valueFrom:
                secretKeyRef: { name: greencity-secrets, key: EMAIL_ADDRESS }
            - name: EMAIL_PASSWORD
              valueFrom:
                secretKeyRef: { name: greencity-secrets, key: EMAIL_PASSWORD }
            - name: GOOGLE_CLIENT_ID
              value: "unused"
            - name: GOOGLE_CLIENT_ID_MANAGER
              value: "unused"
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/user"
            - name: ADDRESS
              value: "http://greencity-alb-1035474643.us-east-1.elb.amazonaws.com/user"
            - name: GREENCITY_SERVER_ADDRESS
              value: "http://core:8080/core"
            - name: CLIENT_ADDRESS
              value: "http://greencity-alb-1035474643.us-east-1.elb.amazonaws.com"
            - name: ECONEWS_ADDRESS
              value: "http://greencity-alb-1035474643.us-east-1.elb.amazonaws.com/#/welcome"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /user/actuator/health
              port: 8060
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /user/actuator/health
              port: 8060
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /user/actuator/health
              port: 8060
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backuser
  namespace: greencity
spec:
  type: NodePort
  selector:
    app: backuser
  ports:
    - port: 8060
      targetPort: 8060
      nodePort: 30860
