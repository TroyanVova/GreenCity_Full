all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    frontend:
      hosts:
        vm-frontend:
          ansible_host: "{{ frontend_ip }}"
    backcore:
      hosts:
        vm-backore:
          ansible_host: "{{ backcore_ip }}"
          app_port: "{{ backcore_port }}"
    backuser:
      hosts:
        vm-backuser:
          ansible_host: "{{ backuser_ip }}"
          app_port: "{{ backuser_port }}"
    postgres:
      hosts:
        vm-postgres:
          ansible_host: "{{ postgres_ip }}"
